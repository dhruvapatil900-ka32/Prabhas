<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prabhas Film Vault</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
}

/* =====================================================
   ROOM
===================================================== */

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            #121212 0%,
            #050505 50%,
            #000 100%
        );
}

/* =====================================================
   FLOOR
===================================================== */

.floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:23%;

    background:
        linear-gradient(
            to bottom,
            #101010,
            #030303 70%,
            #000
        );

    border-top:1px solid #151515;
}

/* =====================================================
   TOP LIGHT
===================================================== */

.ceiling-light{
    position:absolute;
    top:0;
    left:50%;

    transform:translateX(-50%);

    width:520px;
    height:180px;

    z-index:20;

    pointer-events:none;
}

.light-body{
    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    width:340px;
    height:40px;

    background:
        linear-gradient(
            to bottom,
            #282828,
            #111,
            #050505
        );

    border:2px solid #292929;

    border-radius:8px;
}

.light-strip{
    position:absolute;

    top:45px;
    left:50%;

    transform:translateX(-50%);

    width:285px;
    height:8px;

    border-radius:10px;

    background:#090909;

    transition:.6s;
}

.light-beam{
    position:absolute;

    top:50px;
    left:50%;

    transform:translateX(-50%);

    width:430px;
    height:300px;

    opacity:0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,220,160,.18),
            rgba(255,190,100,.06),
            transparent 75%
        );

    clip-path:
        polygon(
            42% 0,
            58% 0,
            100% 100%,
            0 100%
        );

    transition:.8s;
}

.scene.power-on .light-strip{
    background:#ffe5ad;

    box-shadow:
        0 0 10px rgba(255,220,150,.95),
        0 0 25px rgba(255,170,70,.7);
}

.scene.power-on .light-beam{
    opacity:1;
}

/* =====================================================
   TOP TITLE
===================================================== */

.top-title{
    position:absolute;

    top:35px;
    left:50%;

    transform:translateX(-50%);

    width:100%;

    text-align:center;

    z-index:30;

    opacity:.15;
}

.top-title .small{
    font-size:12px;
    letter-spacing:7px;
    color:#555;
}

.top-title .big{
    margin-top:5px;

    font-size:26px;
    font-weight:900;

    letter-spacing:6px;

    color:#777;
}

/* =====================================================
   MACHINE
===================================================== */

.machine-wrap{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(1120px,92vw);
    height:min(690px,82vh);

    z-index:100;
}

.machine{
    position:relative;

    width:100%;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #202020 0%,
            #0e0e0e 30%,
            #090909 70%,
            #171717 100%
        );

    border:4px solid #272727;

    box-shadow:
        0 30px 80px rgba(0,0,0,.95),
        inset 0 0 0 2px #050505;

    overflow:hidden;

    transition:
        filter .8s ease;
}

/*
   BEFORE POWER:
   Whole machine is intentionally very dark.
*/
.scene:not(.power-on) .machine{
    filter:brightness(.20);
}

/*
   When power is ON the machine becomes visible.
*/
.scene.power-on .machine{
    filter:brightness(1);
}

/* =====================================================
   MACHINE HEADER
===================================================== */

.machine-top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:92px;

    background:
        linear-gradient(
            to bottom,
            #242424,
            #0c0c0c
        );

    border-bottom:3px solid #202020;

    display:flex;

    align-items:center;
    justify-content:center;
}

.main-title{
    font-size:28px;

    font-weight:900;

    letter-spacing:5px;

    color:#aaa;
}

.sub-title{
    position:absolute;

    bottom:10px;

    font-size:9px;

    letter-spacing:5px;

    color:#444;
}

/* =====================================================
   CONTENT AREA
===================================================== */

.content-area{
    position:absolute;

    left:0;
    right:0;

    top:92px;
    bottom:0;

    padding:23px 24px 24px 32px;

    display:grid;

    grid-template-columns:
        minmax(0, 64%)
        minmax(0, 29%);

    column-gap:7%;
}

/* =====================================================
   SCREEN
===================================================== */

.screen-section{
    position:relative;

    width:100%;
    height:500px;

    min-width:0;
}

/* GOLD FRAME */

.screen-outer{
    position:relative;

    width:100%;
    height:100%;

    padding:15px;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #604512 0%,
            #171108 25%,
            #3b290d 65%,
            #090909 100%
        );

    border:5px solid #8f661d;

    box-shadow:
        inset 0 0 0 2px #171108,
        inset 0 0 20px #000,
        0 12px 35px rgba(0,0,0,.9);
}

/* GOLD INNER BORDER */

.screen-outer::before{
    content:"";

    position:absolute;

    left:6px;
    right:6px;
    top:6px;
    bottom:6px;

    border:1px solid #c69a42;

    border-radius:10px;

    opacity:.75;

    pointer-events:none;
}

/* BLACK DISPLAY */

.screen{
    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    border:3px solid #050505;

    border-radius:7px;

    box-shadow:
        inset 0 0 35px #000;
}

/* =====================================================
   MEDIA
===================================================== */

.media{
    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;
}

.media.active{
    display:flex;
}

.photo-frame{
    width:100%;
    height:100%;

    padding:12px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.photo-frame img{
    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    display:block;
}

.video-frame{
    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#000;
}

.video-frame video{
    max-width:100%;
    max-height:100%;
}

/* =====================================================
   START SCREEN
===================================================== */

/*
   Initially completely black.
   It appears only after power is turned ON.
*/

.start-screen{
    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    background:#000;

    z-index:10;
}

.scene.power-on .start-screen{
    display:flex;
}

/* GOLD INDIA */

.start-screen .india{
    font-size:18px;

    font-weight:bold;

    letter-spacing:8px;

    color:#d9ad4d;

    text-shadow:
        0 0 8px rgba(180,130,40,.25);
}

/* GOLD SUPERSTAR */

.start-screen .superstar{
    margin-top:10px;

    font-size:38px;

    font-weight:1000;

    letter-spacing:4px;

    background:
        linear-gradient(
            to bottom,
            #fff1a5 0%,
            #e8bc4f 35%,
            #8d5d14 75%,
            #e8c86d 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    text-shadow:
        0 1px 2px rgba(0,0,0,.9);
}

/* PRABHAS */

.start-screen .prabhas{
    margin-top:18px;

    font-size:19px;

    letter-spacing:10px;

    color:#9e7630;
}

/* INSTRUCTION */

.start-screen .instruction{
    margin-top:38px;

    padding:10px 20px;

    border:1px solid #30240f;

    border-radius:5px;

    color:#555;

    font-size:10px;

    letter-spacing:3px;
}

/* =====================================================
   RIGHT CONTROL COLUMN
===================================================== */

.right-area{
    position:relative;

    width:100%;
    height:500px;

    min-width:0;
}

/* =====================================================
   POWER PANEL
===================================================== */

.power-control{
    position:absolute;

    left:0;
    right:0;
    top:0;

    height:150px;
}

.power-plaque{
    position:relative;

    width:100%;
    height:150px;

    padding:15px;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #202020,
            #0b0b0b
        );

    border:2px solid #292929;

    box-shadow:
        inset 0 0 20px #000,
        0 8px 20px rgba(0,0,0,.8);
}

.power-label{
    text-align:center;

    font-size:13px;

    font-weight:bold;

    letter-spacing:4px;

    color:#777;
}

.switch-off-label,
.switch-on-label{
    position:absolute;

    top:49px;

    font-size:9px;

    letter-spacing:2px;

    font-weight:bold;
}

.switch-off-label{
    left:28px;
    color:#555;
}

.switch-on-label{
    right:28px;
    color:#444;
}

/* =====================================================
   VINTAGE SWITCH
===================================================== */

.vintage-switch{
    position:absolute;

    top:59px;
    left:50%;

    transform:translateX(-50%);

    width:96px;
    height:48px;

    border-radius:25px;

    background:
        linear-gradient(
            to bottom,
            #060606,
            #191919
        );

    border:3px solid #333;

    cursor:pointer;

    box-shadow:
        inset 0 3px 8px #000,
        0 3px 8px rgba(0,0,0,.9);

    transition:.3s;

    z-index:20;
}

/*
   Keep switch visible even while the machine
   is dark at startup.
*/
.scene:not(.power-on) .vintage-switch{
    filter:brightness(4);
}

/* glowing halo */

.switch-halo{
    position:absolute;

    inset:-10px;

    border-radius:35px;

    opacity:0;

    transition:.4s;
}

/* center */

.switch-center{
    position:absolute;

    width:30px;
    height:30px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #bbb,
            #555 35%,
            #111 75%
        );

    border:2px solid #555;
}

/* knob */

.switch-knob{
    position:absolute;

    top:4px;
    left:6px;

    width:35px;
    height:35px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ddd,
            #666 35%,
            #151515 78%
        );

    border:2px solid #555;

    box-shadow:
        0 2px 6px #000;

    transition:
        left .35s ease,
        box-shadow .35s ease;
}

/* ON position */

.power-on .switch-knob{
    left:51px;

    box-shadow:
        0 0 10px rgba(255,190,90,1),
        0 0 23px rgba(255,145,35,.9);
}

.power-on .vintage-switch{
    border-color:#76551d;

    box-shadow:
        0 0 18px rgba(255,190,100,.9),
        0 0 38px rgba(255,150,50,.5),
        inset 0 3px 8px #000;
}

.power-on .switch-halo{
    opacity:1;

    box-shadow:
        0 0 15px rgba(255,210,140,.95),
        0 0 32px rgba(255,170,70,.85),
        0 0 60px rgba(255,120,30,.45);
}

.power-on .switch-on-label{
    color:#ffd27d;

    text-shadow:
        0 0 8px rgba(255,180,60,.9);
}

.power-hint{
    position:absolute;

    left:0;
    right:0;

    bottom:8px;

    text-align:center;

    color:#3d3d3d;

    font-size:7px;

    letter-spacing:2px;
}

/* =====================================================
   STATUS
===================================================== */

.status-panel{
    position:absolute;

    left:0;
    right:0;

    top:165px;

    height:100px;

    padding:17px;

    background:#070707;

    border:1px solid #202020;

    text-align:center;
}

.status{
    font-size:10px;

    letter-spacing:3px;

    color:#444;
}

.counter{
    margin-top:10px;

    font-family:monospace;

    font-size:21px;

    color:#444;
}

.power-on .status{
    color:#777;
}

.power-on .counter{
    color:#777;
}

/* =====================================================
   LEVER
===================================================== */

.lever-zone{
    position:absolute;

    left:0;
    right:0;

    top:285px;

    height:215px;

    z-index:300;
}

.lever-label{
    position:absolute;

    top:0;

    left:0;
    right:0;

    text-align:center;

    font-size:9px;

    letter-spacing:3px;

    color:#444;
}

/* rail */

.rail{
    position:absolute;

    top:30px;

    left:50%;

    transform:translateX(-50%);

    width:25px;
    height:135px;

    border-radius:15px;

    background:
        linear-gradient(
            to right,
            #090909,
            #333,
            #090909
        );

    border:2px solid #333;

    box-shadow:
        inset 0 0 8px #000;
}

.rail::after{
    content:"";

    position:absolute;

    left:6px;
    top:7px;

    width:9px;
    height:115px;

    background:#020202;

    border-radius:10px;

    box-shadow:
        inset 0 0 6px #000;
}

/* handle */

.lever-handle{
    position:absolute;

    top:43px;

    left:50%;

    transform:translateX(-50%);

    width:82px;
    height:57px;

    z-index:10;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #505050,
            #202020 35%,
            #080808 70%,
            #333
        );

    border:3px solid #444;

    box-shadow:
        0 8px 15px #000,
        inset 0 2px 5px rgba(255,255,255,.08);

    cursor:grab;

    transition:
        top .25s cubic-bezier(.2,.8,.2,1);
}

.lever-handle::before{
    content:"";

    position:absolute;

    left:10px;
    right:10px;
    top:9px;

    height:5px;

    border-radius:5px;

    background:#555;
}

.lever-handle::after{
    content:"PULL";

    position:absolute;

    left:0;
    right:0;
    bottom:8px;

    text-align:center;

    color:#555;

    font-size:9px;

    letter-spacing:3px;
}

.lever-handle.dragging{
    cursor:grabbing;

    border-color:#777;
}

/* shaft */

.lever-arm{
    position:absolute;

    top:55px;

    left:50%;

    transform:translateX(-50%);

    width:9px;
    height:120px;

    border-radius:8px;

    background:
        linear-gradient(
            to right,
            #080808,
            #333,
            #101010
        );

    border:1px solid #333;

    pointer-events:none;
}

/* pull text */

.pull-text{
    position:absolute;

    bottom:22px;

    left:0;
    right:0;

    text-align:center;

    color:#333;

    font-size:8px;

    letter-spacing:2px;
}

/* base */

.lever-base{
    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:150px;
    height:18px;

    border-radius:10px;

    background:
        linear-gradient(
            to bottom,
            #303030,
            #090909
        );

    border:2px solid #292929;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
    position:absolute;

    bottom:7px;

    left:50%;

    transform:translateX(-50%);

    font-size:7px;

    letter-spacing:3px;

    color:#222;

    z-index:200;
}

/* =====================================================
   SMALL SCREENS
===================================================== */

@media(max-height:700px){

    .machine-wrap{
        height:620px;
    }

    .content-area{
        padding-top:20px;
    }

    .screen-section,
    .right-area{
        height:450px;
    }

    .screen-section{
        height:450px;
    }

    .lever-zone{
        top:250px;
    }
}

</style>
</head>


<body>

<div class="scene" id="scene">

    <!-- FLOOR -->
    <div class="floor"></div>


    <!-- TOP LIGHT -->
    <div class="ceiling-light">

        <div class="light-body"></div>

        <div class="light-strip"></div>

        <div class="light-beam"></div>

    </div>


    <!-- TOP TITLE -->
    <div class="top-title">

        <div class="small">
            THE CINEMA EXPERIENCE
        </div>

        <div class="big">
            PRABHAS
        </div>

    </div>


    <!-- MACHINE -->
    <div class="machine-wrap">

        <div class="machine">


            <!-- HEADER -->
            <div class="machine-top">

                <div class="main-title">
                    THE FILM VAULT
                </div>

                <div class="sub-title">
                    MECHANICAL CINEMA ARCHIVE
                </div>

            </div>


            <!-- CONTENT -->
            <div class="content-area">


                <!-- LEFT SCREEN -->
                <div class="screen-section">

                    <div class="screen-outer">

                        <div class="screen">


                            <!-- START -->
                            <div
                                class="start-screen"
                                id="startScreen">

                                <div class="india">
                                    INDIA'S BIGGEST
                                </div>

                                <div class="superstar">
                                    SUPERSTAR
                                </div>

                                <div class="prabhas">
                                    PRABHAS
                                </div>

                                <div class="instruction">
                                    TURN ON POWER • PULL THE LEVER
                                </div>

                            </div>


                            <!-- PHOTO 0 -->
                            <div
                                class="media"
                                id="media0">

                                <div class="photo-frame">

                                    <img
                                        src="photos/prabhas 0.jpeg">

                                </div>

                            </div>


                            <!-- PHOTO 1 -->
                            <div
                                class="media"
                                id="media1">

                                <div class="photo-frame">

                                    <img
                                        src="photos/Prabhas 1.jpeg">

                                </div>

                            </div>


                            <!-- PHOTO 2 -->
                            <div
                                class="media"
                                id="media2">

                                <div class="photo-frame">

                                    <img
                                        src="photos/prabhas 2.jpeg">

                                </div>

                            </div>


                            <!-- PHOTO 3 -->
                            <div
                                class="media"
                                id="media3">

                                <div class="photo-frame">

                                    <img
                                        src="photos/prabhas 3.jpeg">

                                </div>

                            </div>


                            <!-- PHOTO 4 -->
                            <div
                                class="media"
                                id="media4">

                                <div class="photo-frame">

                                    <img
                                        src="photos/prabhas 4.jpeg">

                                </div>

                            </div>


                            <!-- PHOTO 5 -->
                            <div
                                class="media"
                                id="media5">

                                <div class="photo-frame">

                                    <img
                                        src="photos/prabhas 5.jpeg">

                                </div>

                            </div>


                            <!-- PHOTO 6 -->
                            <div
                                class="media"
                                id="media6">

                                <div class="photo-frame">

                                    <img
                                        src="photos/prabhas 6.jpeg">

                                </div>

                            </div>


                            <!-- VIDEO -->
                            <div
                                class="media"
                                id="media7">

                                <div class="video-frame">

                                    <video
                                        id="prabhasVideo"
                                        controls>

                                        <source
                                            src="photos/prabhas vidio.mp4"
                                            type="video/mp4">

                                    </video>

                                </div>

                            </div>


                        </div>

                    </div>

                </div>


                <!-- RIGHT CONTROLS -->
                <div class="right-area">


                    <!-- POWER -->
                    <div class="power-control">

                        <div class="power-plaque">

                            <div class="power-label">
                                MAIN POWER
                            </div>

                            <div class="switch-off-label">
                                OFF
                            </div>

                            <div class="switch-on-label">
                                ON
                            </div>

                            <div
                                class="vintage-switch"
                                id="powerSwitch">

                                <div class="switch-halo"></div>

                                <div class="switch-center"></div>

                                <div
                                    class="switch-knob">
                                </div>

                            </div>

                            <div class="power-hint">
                                CLICK SWITCH TO POWER MACHINE
                            </div>

                        </div>

                    </div>


                    <!-- STATUS -->
                    <div class="status-panel">

                        <div
                            class="status"
                            id="status">
                            SYSTEM OFFLINE
                        </div>

                        <div
                            class="counter"
                            id="counter">
                            00 / 08
                        </div>

                    </div>


                    <!-- LEVER -->
                    <div class="lever-zone">

                        <div class="lever-label">
                            MECHANICAL SELECTOR
                        </div>

                        <div class="rail"></div>

                        <div class="lever-arm"></div>

                        <div
                            class="lever-handle"
                            id="leverHandle">
                        </div>

                        <div class="pull-text">
                            CLICK + DRAG HANDLE
                        </div>

                        <div class="lever-base"></div>

                    </div>


                </div>

            </div>

        </div>

    </div>


    <div class="footer">
        PRABHAS FILM VAULT • OFFLINE CINEMA EXPERIENCE
    </div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

const scene =
    document.getElementById("scene");

const powerSwitch =
    document.getElementById("powerSwitch");

const leverHandle =
    document.getElementById("leverHandle");

const status =
    document.getElementById("status");

const counter =
    document.getElementById("counter");

const startScreen =
    document.getElementById("startScreen");

const video =
    document.getElementById("prabhasVideo");

let powerOn = false;

let currentFrame = -1;

let dragging = false;

let dragStartY = 0;

let dragDistance = 0;

const LEVER_MAX = 90;


/* =====================================================
   LEVER POSITION
===================================================== */

function setLeverPosition(y){

    if(y < 0){
        y = 0;
    }

    if(y > LEVER_MAX){
        y = LEVER_MAX;
    }

    leverHandle.style.top =
        (43 + y) + "px";
}


/* =====================================================
   HIDE MEDIA
===================================================== */

function hideAllMedia(){

    document
        .querySelectorAll(".media")
        .forEach(function(item){

            item.classList.remove("active");

        });

}


/* =====================================================
   POWER ON
===================================================== */

function turnPowerOn(){

    powerOn = true;

    scene.classList.add("power-on");

    status.textContent =
        "SYSTEM ONLINE";

    startScreen.style.display =
        "flex";

    counter.textContent =
        "00 / 08";

    setLeverPosition(0);
}


/* =====================================================
   POWER OFF
===================================================== */

function turnPowerOff(){

    powerOn = false;

    scene.classList.remove("power-on");

    status.textContent =
        "SYSTEM OFFLINE";

    counter.textContent =
        "00 / 08";

    currentFrame = -1;

    hideAllMedia();

    if(video){

        video.pause();

        video.currentTime = 0;

    }

    setLeverPosition(0);
}


/* =====================================================
   POWER SWITCH
===================================================== */

powerSwitch.addEventListener(
    "click",
    function(){

        if(powerOn){

            turnPowerOff();

        }else{

            turnPowerOn();

        }

    }
);


/* =====================================================
   SHOW MEDIA
===================================================== */

function showFrame(number){

    if(!powerOn){
        return;
    }

    hideAllMedia();

    startScreen.style.display =
        "none";

    const target =
        document.getElementById(
            "media" + number
        );

    if(target){

        target.classList.add("active");

    }

    currentFrame = number;

    counter.textContent =
        (number + 1) + " / 08";


    if(video && number !== 7){

        video.pause();

    }


    if(video && number === 7){

        video.currentTime = 0;

        video.play().catch(function(){});

    }
}


/* =====================================================
   NEXT MEDIA
===================================================== */

function triggerMachine(){

    if(!powerOn){
        return;
    }

    let next =
        currentFrame + 1;

    if(next > 7){

        next = 0;

    }

    showFrame(next);
}


/* =====================================================
   LEVER DOWN
===================================================== */

leverHandle.addEventListener(
    "pointerdown",
    function(e){

        if(!powerOn){
            return;
        }

        dragging = true;

        dragStartY =
            e.clientY;

        dragDistance = 0;

        leverHandle.classList.add(
            "dragging"
        );

        leverHandle.style.transition =
            "none";

        leverHandle.setPointerCapture(
            e.pointerId
        );

        e.preventDefault();

    }
);


/* =====================================================
   LEVER MOVE
===================================================== */

leverHandle.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }

        let movement =
            e.clientY - dragStartY;

        dragDistance =
            Math.abs(movement);

        if(movement < 0){
            movement = 0;
        }

        if(movement > LEVER_MAX){
            movement = LEVER_MAX;
        }

        setLeverPosition(
            movement
        );

        e.preventDefault();

    }
);


/* =====================================================
   LEVER RELEASE
===================================================== */

leverHandle.addEventListener(
    "pointerup",
    function(e){

        if(!dragging){
            return;
        }

        dragging = false;

        leverHandle.classList.remove(
            "dragging"
        );

        leverHandle.style.transition =
            "top .25s cubic-bezier(.2,.8,.2,1)";


        if(dragDistance > 15){

            triggerMachine();

        }


        setTimeout(function(){

            setLeverPosition(0);

        },120);


        try{

            leverHandle.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}

        e.preventDefault();

    }
);


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.code === "Space"){

            e.preventDefault();

            if(powerOn){

                triggerMachine();

            }

        }

    }
);


/* =====================================================
   INITIAL STATE
===================================================== */

setLeverPosition(0);

</script>

</body>
</html>
